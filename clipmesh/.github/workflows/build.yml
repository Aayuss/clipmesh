name: Build ClipMesh

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: ClipMesh-macOS
            path: dist/macos
          - os: windows-2025
            artifact: ClipMesh-Windows
            path: dist/windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core
        run: cargo test -p clipmesh-core
      - name: Build macOS
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug APK
        run: ./scripts/build-android-debug.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Android-debug
          path: dist/android/ClipMesh-debug.apk
