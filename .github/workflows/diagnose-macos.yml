name: Diagnose ClipMesh macOS startup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct validated icon assets
        run: python ci/prepare-icon-assets.py
      - name: Unpack exact source archive
        run: python ci/unpack.py
      - name: Inspect startup and secret-storage sources
        shell: bash
        run: |
          echo '===== apps/desktop/src/config.rs ====='
          cat clipmesh/apps/desktop/src/config.rs
          echo '===== apps/desktop/src/secrets.rs ====='
          cat clipmesh/apps/desktop/src/secrets.rs
          echo '===== apps/desktop/Cargo.toml ====='
          cat clipmesh/apps/desktop/Cargo.toml
          echo '===== workspace Cargo.toml ====='
          cat clipmesh/Cargo.toml
