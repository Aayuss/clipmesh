name: Validate Comprehensive Physical Acceptance Harness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dev-test-comprehensive.sh'
      - 'dev-test-final.sh'
      - 'dev/android/AcceptanceReceiverV2.kt'
      - 'dev/android/DevTestFileProvider.kt'
      - 'dev/macos-pasteboard-helper.swift'
      - 'ci/reconstruct.py'
      - 'ci/patch-v033-ipv4-transfer.py'
      - 'ci/patch-v038-file-transfer-visibility.py'
      - 'ci/patch-v039-lan-discovery.py'
      - 'ci/patch-v040-macos-resilience.py'
      - 'ci/patch-acceptance-v2.py'
      - 'ci/patch-acceptance-v3.py'
      - 'ci/patch-acceptance-v4.py'
      - 'ci/patch-acceptance-v5.py'
      - 'ci/patch-acceptance-chain.py'
      - 'ci/finalize-comprehensive-runner.py'
      - 'ci/finalize-physical-v2.py'
      - 'ci/finalize-physical-v3.py'
      - 'ci/v037_acceptance_selftest.py'
      - 'ci/build-android-release.sh'
      - '.github/workflows/acceptance-harness.yml'
      - '.github/workflows/dev-harness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dev-test-comprehensive.sh'
      - 'dev-test-final.sh'
      - 'dev/android/AcceptanceReceiverV2.kt'
      - 'dev/android/DevTestFileProvider.kt'
      - 'dev/macos-pasteboard-helper.swift'
      - 'ci/reconstruct.py'
      - 'ci/patch-v033-ipv4-transfer.py'
      - 'ci/patch-v038-file-transfer-visibility.py'
      - 'ci/patch-v039-lan-discovery.py'
      - 'ci/patch-v040-macos-resilience.py'
      - 'ci/patch-acceptance-v2.py'
      - 'ci/patch-acceptance-v3.py'
      - 'ci/patch-acceptance-v4.py'
      - 'ci/patch-acceptance-v5.py'
      - 'ci/patch-acceptance-chain.py'
      - 'ci/finalize-comprehensive-runner.py'
      - 'ci/finalize-physical-v2.py'
      - 'ci/finalize-physical-v3.py'
      - 'ci/v037_acceptance_selftest.py'
      - 'ci/build-android-release.sh'
      - '.github/workflows/acceptance-harness.yml'
      - '.github/workflows/dev-harness.yml'

permissions:
  contents: read

jobs:
  macos-acceptance-build:
    name: macOS acceptance instrumentation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate acceptance sources and final runner
        run: |
          set -euo pipefail
          python -m py_compile ci/patch-v033-ipv4-transfer.py ci/patch-v038-file-transfer-visibility.py ci/patch-v039-lan-discovery.py ci/patch-v040-macos-resilience.py ci/patch-acceptance-v2.py ci/patch-acceptance-v3.py ci/patch-acceptance-v4.py ci/patch-acceptance-v5.py ci/patch-acceptance-chain.py ci/finalize-comprehensive-runner.py ci/finalize-physical-v2.py ci/finalize-physical-v3.py ci/v037_acceptance_selftest.py
          bash -n dev-test-comprehensive.sh
          bash -n dev-test-final.sh
          python ci/finalize-comprehensive-runner.py dev-test-comprehensive.sh /tmp/clipmesh-final-v1.sh
          python ci/finalize-physical-v2.py /tmp/clipmesh-final-v1.sh /tmp/clipmesh-final-v2.sh
          python ci/finalize-physical-v3.py /tmp/clipmesh-final-v2.sh /tmp/clipmesh-final-physical.sh
          bash -n /tmp/clipmesh-final-physical.sh
          grep -q 'FINAL_COMPREHENSIVE_RUNNER_AUDIT_V1' /tmp/clipmesh-final-physical.sh
          grep -q 'PHYSICAL_HARDENING_V2' /tmp/clipmesh-final-physical.sh
          grep -q 'PHYSICAL_HARDENING_V3' /tmp/clipmesh-final-physical.sh
          grep -q 'CLIPMESH_CODESIGN_IDENTITY="-"' /tmp/clipmesh-final-physical.sh
          grep -q 'dev.ClipMesh.ClipMesh-Acceptance' /tmp/clipmesh-final-physical.sh
          grep -q 'm2a-reset-' /tmp/clipmesh-final-physical.sh
          grep -q 'last_prompt_decision=' /tmp/clipmesh-final-physical.sh
          grep -q 'Mac restart restores clipboard daemon' /tmp/clipmesh-final-physical.sh
          grep -q 'Mac restart restores acceptance UI command loop' /tmp/clipmesh-final-physical.sh
          grep -q 'patch-acceptance-chain.py' /tmp/clipmesh-final-physical.sh
          grep -q 'wait_driver SET_IMAGE' /tmp/clipmesh-final-physical.sh
          grep -q 'distinct_hashes=2' /tmp/clipmesh-final-physical.sh
          grep -q 'before_prompt=' /tmp/clipmesh-final-physical.sh
          grep -q 'before_pending=' /tmp/clipmesh-final-physical.sh
          grep -q 'clipmesh_file_requests_v020' /tmp/clipmesh-final-physical.sh
          grep -q 'BASE_LASTANR=' /tmp/clipmesh-final-physical.sh
          ! grep -q 'date +%s%N' /tmp/clipmesh-final-physical.sh
          swiftc dev/macos-pasteboard-helper.swift -o /tmp/clipmesh-acceptance-pasteboard
          /tmp/clipmesh-acceptance-pasteboard change-count >/dev/null
      - name: Reconstruct and instrument macOS
        run: |
          set -euo pipefail
          python ci/reconstruct.py --platform Darwin
          grep -q 'SO_BROADCAST' ci/ClipMeshTransfer.swift
          grep -q '255.255.255.255' ci/ClipMeshTransfer.swift
          grep -q 'scheduleDaemonRestart' ci/ClipMeshApp.swift
          grep -q 'clipboardDaemonIsListening' ci/ClipMeshApp.swift
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('ci/ClipMeshApp.swift').read_text()
          f=re.search(r'private\s+func\s+refreshTransferDevices\s*\(\)\s*\{(.*?)(?=\n\s*private\s+func\s+)',s,re.S)
          p=re.search(r'private\s+func\s+refreshNearbyPairDevices\s*\(\)\s*\{(.*?)(?=\n\s*private\s+func\s+)',s,re.S)
          assert f and 'LocalTransferManager.shared.nearbyDevices()' in f.group(1) and 'pairedNames' not in f.group(1)
          assert p and 'pairedNames' in p.group(1)
          PY
          CLIPMESH_PLATFORM=Darwin python ci/patch-acceptance-chain.py
          CLIPMESH_PLATFORM=Darwin python ci/v037_acceptance_selftest.py
          grep -q -- '--dev-accept-set-favorite' ci/ClipMeshApp.swift
          grep -q -- '--dev-accept-command' ci/ClipMeshApp.swift
          grep -q -- '--dev-accept-send-files' ci/ClipMeshApp.swift
          grep -q 'acceptance-command.txt' ci/ClipMeshApp.swift
          grep -q 'acceptance-ack.txt' ci/ClipMeshApp.swift
          grep -q 'acceptance-incoming-policy.txt' ci/ClipMeshApp.swift
          grep -q 'acceptance-incoming-policy.txt' ci/ClipMeshTransfer.swift
          grep -q 'dev.ClipMesh.ClipMesh-Acceptance' ci/ClipMeshApp.swift
          grep -q 'last_prompt_decision=' ci/ClipMeshApp.swift
          grep -q 'ClipMesh.Acceptance.LastPromptDecision' ci/ClipMeshTransfer.swift
          grep -q 'alert.buttons\[index\].performClick(nil)' ci/ClipMeshTransfer.swift
          grep -q 'devAcceptanceSnapshotLines' ci/ClipMeshTransfer.swift
          grep -q 'private let httpQueue' ci/ClipMeshTransfer.swift
          grep -q 'listener.start(queue: httpQueue)' ci/ClipMeshTransfer.swift
          grep -q 'ACCEPTANCE-ONLY SECRET BACKEND' clipmesh/apps/desktop/src/secrets.rs
          grep -q '0o600' clipmesh/apps/desktop/src/secrets.rs
          ! grep -q '^use keyring::Entry;' clipmesh/apps/desktop/src/secrets.rs
          ! grep -Fq 'Entry::new(' clipmesh/apps/desktop/src/secrets.rs
          ! grep -Fq 'set_password(' clipmesh/apps/desktop/src/secrets.rs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Build acceptance-instrumented macOS app
        working-directory: clipmesh
        run: |
          set -euo pipefail
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
          APP=dist/macos/ClipMesh.app/Contents/MacOS/ClipMesh
          test -x "$APP"
          "$APP" --dev-accept-reset-metrics | grep -q 'reset=PASS'
          "$APP" --dev-accept-state | grep -q '^prompt_count=0$'
          codesign --verify --deep --strict dist/macos/ClipMesh.app

  android-acceptance-build:
    name: Android acceptance instrumentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Reconstruct and instrument Android
        run: |
          set -euo pipefail
          python -m py_compile ci/patch-v033-ipv4-transfer.py ci/patch-v038-file-transfer-visibility.py ci/patch-v039-lan-discovery.py ci/patch-v040-macos-resilience.py ci/patch-acceptance-v2.py ci/patch-acceptance-v3.py ci/patch-acceptance-v4.py ci/patch-acceptance-v5.py ci/patch-acceptance-chain.py ci/finalize-comprehensive-runner.py ci/finalize-physical-v2.py ci/finalize-physical-v3.py ci/v037_acceptance_selftest.py
          python ci/reconstruct.py --platform Linux
          J=clipmesh/android/app/src/main/java/dev/clipmesh
          grep -q 'val devices = runCatching { LocalTransferEngine.nearbyDevices() }.getOrDefault(emptyList())' "$J/fileshare/FileShareActivity.kt"
          ! grep -q 'nearbyDevices().filterNot' "$J/fileshare/FileShareActivity.kt"
          grep -q '255.255.255.255' "$J/fileshare/LocalTransferEngine.kt"
          grep -q 'socket.broadcast = true' "$J/fileshare/LocalTransferEngine.kt"
          CLIPMESH_PLATFORM=Linux python ci/patch-acceptance-chain.py
          CLIPMESH_PLATFORM=Linux python ci/v037_acceptance_selftest.py
          D=clipmesh/android/app/src/debug/java/dev/clipmesh
          DM=clipmesh/android/app/src/debug/AndroidManifest.xml
          grep -q 'class AcceptanceReceiver' "$D/AcceptanceReceiver.kt"
          grep -q 'ACTION_SEND_GENERATED' "$D/AcceptanceReceiver.kt"
          grep -q 'ACTION_RESOLVE_PENDING' "$D/AcceptanceReceiver.kt"
          grep -q 'ACTION_SET_POLICY' "$D/AcceptanceReceiver.kt"
          grep -q 'devAcceptancePendingRequestIds' "$J/fileshare/LocalTransferEngine.kt"
          grep -q 'clipboard_nearby_count' "$J/MainActivity.kt"
          grep -q 'file_nearby_count' "$J/fileshare/FileShareActivity.kt"
          grep -q 'incoming_policy' "$J/fileshare/IncomingRequestUi.kt"
          grep -q '\.AcceptanceReceiver' "$DM"
          grep -q 'android.permission.DUMP' "$DM"
      - name: Compile acceptance-instrumented Android app
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          cd clipmesh/android
          chmod +x gradlew
          ./gradlew :app:assembleDebug :devdriver:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s devdriver/build/outputs/apk/debug/devdriver-debug.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print app/build/outputs/apk/debug/app-debug.apk > /tmp/acceptance-manifest.xml
          grep -q 'dev.clipmesh.AcceptanceReceiver' /tmp/acceptance-manifest.xml
          grep -q 'android.permission.DUMP' /tmp/acceptance-manifest.xml
          test ! -e app/src/main/java/dev/clipmesh/AcceptanceReceiver.kt
