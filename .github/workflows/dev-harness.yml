name: Validate ClipMesh Dev Harness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dev-test.sh'
      - 'dev-test-all.sh'
      - 'dev-test-comprehensive.sh'
      - 'dev-test-final.sh'
      - 'dev/**'
      - 'ci/reconstruct.py'
      - 'ci/patch-v031-dev-test.py'
      - 'ci/patch-v032-release.py'
      - 'ci/patch-v033-ipv4-transfer.py'
      - 'ci/patch-v034-shizuku-clipboard.py'
      - 'ci/patch-v035-e2e-observability.py'
      - 'ci/patch-v038-file-transfer-visibility.py'
      - 'ci/patch-v039-lan-discovery.py'
      - 'ci/patch-v040-macos-resilience.py'
      - 'ci/patch-v044-image-provenance.py'
      - 'ci/patch-v045-screenshot-adjacent-dedupe.py'
      - 'ci/patch-acceptance-v4.py'
      - 'ci/patch-acceptance-v5.py'
      - 'ci/patch-acceptance-chain.py'
      - 'ci/finalize-comprehensive-runner.py'
      - 'ci/finalize-physical-v2.py'
      - 'ci/finalize-physical-v3.py'
      - 'ci/finalize-physical-v4.py'
      - 'ci/v031_devtest_selftest.py'
      - 'ci/v032_release_signing_selftest.py'
      - 'ci/v033_ipv4_transfer_selftest.py'
      - 'ci/v034_shizuku_clipboard_selftest.py'
      - 'ci/v037_acceptance_selftest.py'
      - '.github/workflows/dev-harness.yml'
      - '.github/workflows/acceptance-harness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dev-test.sh'
      - 'dev-test-all.sh'
      - 'dev-test-comprehensive.sh'
      - 'dev-test-final.sh'
      - 'dev/**'
      - 'ci/reconstruct.py'
      - 'ci/patch-v031-dev-test.py'
      - 'ci/patch-v032-release.py'
      - 'ci/patch-v033-ipv4-transfer.py'
      - 'ci/patch-v034-shizuku-clipboard.py'
      - 'ci/patch-v035-e2e-observability.py'
      - 'ci/patch-v038-file-transfer-visibility.py'
      - 'ci/patch-v039-lan-discovery.py'
      - 'ci/patch-v040-macos-resilience.py'
      - 'ci/patch-v044-image-provenance.py'
      - 'ci/patch-v045-screenshot-adjacent-dedupe.py'
      - 'ci/patch-acceptance-v4.py'
      - 'ci/patch-acceptance-v5.py'
      - 'ci/patch-acceptance-chain.py'
      - 'ci/finalize-comprehensive-runner.py'
      - 'ci/finalize-physical-v2.py'
      - 'ci/finalize-physical-v3.py'
      - 'ci/finalize-physical-v4.py'
      - 'ci/v031_devtest_selftest.py'
      - 'ci/v032_release_signing_selftest.py'
      - 'ci/v033_ipv4_transfer_selftest.py'
      - 'ci/v034_shizuku_clipboard_selftest.py'
      - 'ci/v037_acceptance_selftest.py'
      - '.github/workflows/dev-harness.yml'
      - '.github/workflows/acceptance-harness.yml'

permissions:
  contents: read

jobs:
  macos-harness:
    name: macOS harness build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate harness scripts
        run: |
          set -euo pipefail
          python -m py_compile ci/reconstruct.py ci/patch-v031-dev-test.py ci/patch-v032-release.py ci/patch-v033-ipv4-transfer.py ci/patch-v034-shizuku-clipboard.py ci/patch-v035-e2e-observability.py ci/patch-v038-file-transfer-visibility.py ci/patch-v039-lan-discovery.py ci/patch-v040-macos-resilience.py ci/patch-v044-image-provenance.py ci/patch-v045-screenshot-adjacent-dedupe.py ci/patch-acceptance-v4.py ci/patch-acceptance-v5.py ci/patch-acceptance-chain.py ci/finalize-comprehensive-runner.py ci/finalize-physical-v2.py ci/finalize-physical-v3.py ci/finalize-physical-v4.py ci/v031_devtest_selftest.py ci/v032_release_signing_selftest.py ci/v033_ipv4_transfer_selftest.py ci/v034_shizuku_clipboard_selftest.py ci/v037_acceptance_selftest.py dev/uia-find-allow.py
          bash -n dev-test.sh
          bash -n dev-test-all.sh
          bash -n dev-test-final.sh
          python ci/finalize-comprehensive-runner.py dev-test-comprehensive.sh /tmp/clipmesh-final-v1.sh
          python ci/finalize-physical-v2.py /tmp/clipmesh-final-v1.sh /tmp/clipmesh-final-v2.sh
          python ci/finalize-physical-v3.py /tmp/clipmesh-final-v2.sh /tmp/clipmesh-final-v3.sh
          python ci/finalize-physical-v4.py /tmp/clipmesh-final-v3.sh /tmp/clipmesh-final-physical.sh
          bash -n /tmp/clipmesh-final-physical.sh
          grep -q 'FINAL_COMPREHENSIVE_RUNNER_AUDIT_V1' /tmp/clipmesh-final-physical.sh
          grep -q 'PHYSICAL_HARDENING_V2' /tmp/clipmesh-final-physical.sh
          grep -q 'PHYSICAL_HARDENING_V3' /tmp/clipmesh-final-physical.sh
          grep -q 'PHYSICAL_HARDENING_V4_IMAGE_ECHO' /tmp/clipmesh-final-physical.sh
          grep -q 'CLIPMESH_CODESIGN_IDENTITY="-"' /tmp/clipmesh-final-physical.sh
          grep -q 'Mac restart restores clipboard daemon' /tmp/clipmesh-final-physical.sh
          swiftc dev/macos-pasteboard-helper.swift -o /tmp/clipmesh-pasteboard-helper
          /tmp/clipmesh-pasteboard-helper image-info >/dev/null
      - name: Reconstruct macOS dev source
        run: |
          set -euo pipefail
          python ci/reconstruct.py --platform Darwin
          python ci/v031_devtest_selftest.py
          python ci/v032_release_signing_selftest.py
          python ci/v033_ipv4_transfer_selftest.py
          grep -q -- '--dev-test-transfer-fingerprint' ci/ClipMeshApp.swift
          grep -q -- '--dev-test-send-file' ci/ClipMeshApp.swift
          grep -q 'func devTestSend' ci/ClipMeshTransfer.swift
          grep -q 'private let httpQueue' ci/ClipMeshTransfer.swift
          grep -q 'private let discoveryQueue' ci/ClipMeshTransfer.swift
          grep -q 'listener.start(queue: httpQueue)' ci/ClipMeshTransfer.swift
          grep -q 'connection.start(queue: httpQueue)' ci/ClipMeshTransfer.swift
          ! grep -q 'self.queue.asyncAfter' ci/ClipMeshTransfer.swift
          grep -q 'scheduleDaemonRestart' ci/ClipMeshApp.swift
          grep -q 'clipboardDaemonIsListening' ci/ClipMeshApp.swift
          grep -Fq 'fn observation_fingerprint(payload: &ClipPayload)' clipmesh/apps/desktop/src/clipboard.rs
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('ci/ClipMeshApp.swift').read_text()
          f=re.search(r'private\s+func\s+refreshTransferDevices\s*\(\)\s*\{(.*?)(?=\n\s*private\s+func\s+)',s,re.S)
          assert f and 'LocalTransferManager.shared.nearbyDevices()' in f.group(1) and 'pairedNames' not in f.group(1)
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Build and exercise dev CLI
        working-directory: clipmesh
        run: |
          set -euo pipefail
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
          APP=dist/macos/ClipMesh.app/Contents/MacOS/ClipMesh
          test -x "$APP"
          fp="$($APP --dev-test-transfer-fingerprint)"
          test -n "$fp"
          "$APP" --dev-test-favorite ci-harness-fingerprint | grep -q 'favorited ci-harness-fingerprint'
          codesign --verify --deep --strict dist/macos/ClipMesh.app

  android-harness:
    name: Android harness compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Reconstruct Android dev source
        run: |
          set -euo pipefail
          python ci/reconstruct.py --platform Linux
          python ci/v031_devtest_selftest.py
          python ci/v032_release_signing_selftest.py
          python ci/v033_ipv4_transfer_selftest.py
          python ci/v034_shizuku_clipboard_selftest.py
          J=clipmesh/android/app/src/main/java/dev/clipmesh
          D=clipmesh/android/app/src/debug/java/dev/clipmesh
          DM=clipmesh/android/app/src/debug/AndroidManifest.xml
          test ! -e "$J/CiBackgroundCaptureReceiver.kt"
          grep -q 'class CiBackgroundCaptureReceiver' "$D/CiBackgroundCaptureReceiver.kt"
          grep -q 'class DevTestReceiver' "$D/DevTestReceiver.kt"
          grep -q 'ACTION_SEND_FILE' "$D/DevTestReceiver.kt"
          grep -q 'ACTION_READ_SHIZUKU' "$D/DevTestReceiver.kt"
          grep -q 'ACTION_WRITE_SHIZUKU' "$D/DevTestReceiver.kt"
          grep -q 'val clearInboundIdentity = methodName == "getPrimaryClip"' "$J/shizuku/ClipboardUserService.kt"
          grep -q 'Binder.clearCallingIdentity()' "$J/shizuku/ClipboardUserService.kt"
          grep -q 'if (clearInboundIdentity) Binder.restoreCallingIdentity(callingIdentity)' "$J/shizuku/ClipboardUserService.kt"
          grep -q '\.version(11)' "$J/shizuku/ShizukuManager.kt"
          grep -q 'last_remote_received_at' "$J/BackgroundRuntime.kt"
          grep -q 'debugPeerCount' "$J/BackgroundRuntime.kt"
          grep -q 'last_remote_shizuku_write_ok' "$J/clipboard/ClipboardBridge.kt"
          grep -Fq 'if (clip.itemCount == 0 || isRemoteClip(clip)) return null' "$J/clipboard/ClipboardBridge.kt"
          grep -Fq 'val remoteFingerprint = echoFingerprint(payload)' "$J/clipboard/ClipboardBridge.kt"
          grep -Fq 'ExifInterface.TAG_ORIENTATION' "$J/clipboard/ClipboardBridge.kt"
          grep -Fq 'incrementDebugCounter("outgoing_clip_count")' "$J/clipboard/ClipboardBridge.kt"
          grep -Fq 'incrementDebugCounter("remote_apply_count")' "$J/clipboard/ClipboardBridge.kt"
          grep -Fq 'registerContentObserver(' "$J/clipboard/ClipboardBridge.kt"
          grep -Fq 'sourceApp = "android.screenshot"' "$J/clipboard/ClipboardBridge.kt"
          grep -Fq 'adjacent_duplicate_suppressed_count' "$J/clipboard/ClipboardBridge.kt"
          grep -q 'val devices = runCatching { LocalTransferEngine.nearbyDevices() }.getOrDefault(emptyList())' "$J/fileshare/FileShareActivity.kt"
          ! grep -q 'nearbyDevices().filterNot' "$J/fileshare/FileShareActivity.kt"
          grep -q 'dev.clipmesh.action.CI_BACKGROUND_CAPTURE' "$DM"
          grep -q 'android.permission.DUMP' "$DM"
          grep -q 'include(":devdriver")' clipmesh/android/settings.gradle.kts
          grep -q 'wait_image' clipmesh/android/devdriver/src/main/java/dev/clipmesh/testdriver/MainActivity.kt
          grep -q 'OnPrimaryClipChangedListener' clipmesh/android/devdriver/src/main/java/dev/clipmesh/testdriver/MainActivity.kt
          grep -q 'pollCurrent = true' clipmesh/android/devdriver/src/main/java/dev/clipmesh/testdriver/MainActivity.kt
          grep -q 'set_oriented_image' clipmesh/android/devdriver/src/main/java/dev/clipmesh/testdriver/MainActivity.kt
      - name: Compile ClipMesh and foreground clipboard driver
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          cd clipmesh/android
          chmod +x gradlew
          ./gradlew :app:assembleDebug :devdriver:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s devdriver/build/outputs/apk/debug/devdriver-debug.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print app/build/outputs/apk/debug/app-debug.apk > /tmp/app-manifest.xml
          grep -q 'dev.clipmesh.CiBackgroundCaptureReceiver' /tmp/app-manifest.xml
          grep -q 'dev.clipmesh.DevTestReceiver' /tmp/app-manifest.xml
          grep -q 'android.permission.DUMP' /tmp/app-manifest.xml
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print devdriver/build/outputs/apk/debug/devdriver-debug.apk > /tmp/driver-manifest.xml
          grep -q 'package="dev.clipmesh.testdriver"' /tmp/driver-manifest.xml
