name: Inspect ClipMesh source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct validated icon assets
        run: python ci/prepare-icon-assets.py
      - name: Unpack source
        run: python ci/unpack.py
      - name: Print targeted source files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            clipmesh/apps/desktop/src/config.rs \
            clipmesh/apps/desktop/src/main.rs \
            clipmesh/apps/desktop/src/network.rs \
            clipmesh/apps/desktop/src/secrets.rs \
            clipmesh/android/app/src/main/java/dev/clipmesh/MainActivity.kt \
            clipmesh/android/app/src/main/java/dev/clipmesh/SettingsStore.kt \
            clipmesh/android/app/src/main/java/dev/clipmesh/Pairing.kt \
            clipmesh/android/app/src/main/java/dev/clipmesh/network/NetworkEngine.kt \
            clipmesh/android/app/src/main/java/dev/clipmesh/SyncService.kt \
            clipmesh/android/app/src/main/AndroidManifest.xml \
            clipmesh/android/app/src/main/res/values/styles.xml \
            clipmesh/android/app/src/main/res/drawable/ic_clipmesh_notification.xml
          do
            echo "===== BEGIN $f ====="
            cat "$f"
            echo "===== END $f ====="
          done
