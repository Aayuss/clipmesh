name: Cleanup old ClipMesh releases

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release ClipMesh v0.2.27"]
    types: [completed]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Keep latest five versioned releases
    runs-on: ubuntu-24.04
    steps:
      - name: Delete versioned releases older than the latest five
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -t releases < <(
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("v")) | [.published_at, .tag_name] | @tsv' \
              | sort -r \
              | cut -f2
          )

          echo "Versioned releases, newest first:"
          printf '  %s\n' "${releases[@]}"

          if [ "${#releases[@]}" -le 5 ]; then
            echo "Nothing to delete."
            exit 0
          fi

          echo "Keeping:"
          printf '  %s\n' "${releases[@]:0:5}"

          for tag in "${releases[@]:5}"; do
            echo "Deleting old release $tag (tag is preserved)"
            gh release delete "$tag" --repo "$GH_REPO" --yes
          done

          gh release view dev-latest --repo "$GH_REPO" >/dev/null

          remaining="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.tag_name | startswith("v"))] | length' | awk '{s+=$1} END {print s+0}')"
          test "$remaining" -eq 5
          echo "Cleanup complete: five versioned releases remain; dev-latest is preserved."
