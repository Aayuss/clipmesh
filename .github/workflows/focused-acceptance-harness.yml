name: Validate Focused Physical Retry Harness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dev-test-retry-failures.sh'
      - 'dev-test-final.sh'
      - 'dev-test-comprehensive.sh'
      - 'ci/reconstruct.py'
      - 'ci/patch-v043-desktop-image-echo.py'
      - 'ci/patch-v044-image-provenance.py'
      - 'ci/patch-v045-screenshot-adjacent-dedupe.py'
      - 'ci/patch-v052-android-clipboard-runtime.py'
      - 'ci/patch-v053-second-pass-runtime.py'
      - 'ci/v052_android_clipboard_runtime_selftest.py'
      - 'ci/v053_second_pass_selftest.py'
      - 'ci/patch-acceptance-v5.py'
      - 'ci/focus-physical-failures.py'
      - 'ci/finalize-comprehensive-runner.py'
      - 'ci/finalize-physical-v2.py'
      - 'ci/finalize-physical-v3.py'
      - 'ci/finalize-physical-v4.py'
      - '.github/workflows/focused-acceptance-harness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dev-test-retry-failures.sh'
      - 'dev-test-final.sh'
      - 'dev-test-comprehensive.sh'
      - 'ci/reconstruct.py'
      - 'ci/patch-v043-desktop-image-echo.py'
      - 'ci/patch-v044-image-provenance.py'
      - 'ci/patch-v045-screenshot-adjacent-dedupe.py'
      - 'ci/patch-v052-android-clipboard-runtime.py'
      - 'ci/patch-v053-second-pass-runtime.py'
      - 'ci/v052_android_clipboard_runtime_selftest.py'
      - 'ci/v053_second_pass_selftest.py'
      - 'ci/patch-acceptance-v5.py'
      - 'ci/focus-physical-failures.py'
      - 'ci/finalize-comprehensive-runner.py'
      - 'ci/finalize-physical-v2.py'
      - 'ci/finalize-physical-v3.py'
      - 'ci/finalize-physical-v4.py'
      - '.github/workflows/focused-acceptance-harness.yml'

permissions:
  contents: read

jobs:
  validate-focused-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate and audit focused clipboard retry runner
        run: |
          set -euo pipefail
          python -m py_compile \
            ci/patch-v043-desktop-image-echo.py \
            ci/patch-v044-image-provenance.py \
            ci/patch-v045-screenshot-adjacent-dedupe.py \
            ci/patch-v052-android-clipboard-runtime.py \
            ci/patch-v053-second-pass-runtime.py \
            ci/patch-acceptance-v5.py \
            ci/finalize-comprehensive-runner.py \
            ci/finalize-physical-v2.py \
            ci/finalize-physical-v3.py \
            ci/finalize-physical-v4.py \
            ci/focus-physical-failures.py \
            ci/v052_android_clipboard_runtime_selftest.py \
            ci/v053_second_pass_selftest.py
          bash -n dev-test-comprehensive.sh
          bash -n dev-test-final.sh
          bash -n dev-test-retry-failures.sh

          python ci/reconstruct.py --platform Darwin
          grep -Fq 'remote_write_depth: usize' clipmesh/apps/desktop/src/clipboard.rs
          grep -Fq 'state.begin_remote_write(fp)' clipmesh/apps/desktop/src/clipboard.rs
          grep -Fq 'observe_cfg.exclusions.clear()' clipmesh/apps/desktop/src/clipboard.rs
          grep -Fq 'state.finish_remote_write(actual_fingerprint)' clipmesh/apps/desktop/src/clipboard.rs
          grep -Fq 'if state.remote_write_depth>0' clipmesh/apps/desktop/src/clipboard.rs
          ! grep -Fq 'suppress_next_observed' clipmesh/apps/desktop/src/clipboard.rs
          ! grep -Fq 'state.suppress(fp)' clipmesh/apps/desktop/src/clipboard.rs
          grep -Fq 'fn observation_fingerprint(payload: &ClipPayload)' clipmesh/apps/desktop/src/clipboard.rs
          grep -Fq 'image_observation_fingerprint_ignores_png_container_reencoding' clipmesh/apps/desktop/src/clipboard.rs
          grep -Fq 'ignored adjacent duplicate remote clipboard content' clipmesh/apps/desktop/src/clipboard.rs

          mkdir -p /tmp/clipmesh-v044-linux
          git archive HEAD | tar -x -C /tmp/clipmesh-v044-linux
          python /tmp/clipmesh-v044-linux/ci/reconstruct.py --platform Linux
          AJ=/tmp/clipmesh-v044-linux/clipmesh/android/app/src/main/java/dev/clipmesh
          grep -Fq 'if (clip.itemCount == 0 || isRemoteClip(clip)) return null' "$AJ/clipboard/ClipboardBridge.kt"
          grep -Fq 'val remoteFingerprint = echoFingerprint(payload)' "$AJ/clipboard/ClipboardBridge.kt"
          grep -Fq 'ExifInterface.TAG_ORIENTATION' "$AJ/clipboard/ClipboardBridge.kt"
          grep -Fq 'incrementDebugCounter("outgoing_clip_count")' "$AJ/clipboard/ClipboardBridge.kt"
          grep -Fq 'incrementDebugCounter("remote_apply_count")' "$AJ/clipboard/ClipboardBridge.kt"
          grep -Fq '.put("remote", remote)' "$AJ/shizuku/ClipboardUserService.kt"
          grep -Fq 'registerContentObserver(' "$AJ/clipboard/ClipboardBridge.kt"
          grep -Fq 'sourceApp = "android.screenshot"' "$AJ/clipboard/ClipboardBridge.kt"
          grep -Fq 'adjacent_duplicate_suppressed_count' "$AJ/clipboard/ClipboardBridge.kt"
          grep -Fq '.version(12)' "$AJ/shizuku/ShizukuManager.kt"
          python /tmp/clipmesh-v044-linux/ci/v052_android_clipboard_runtime_selftest.py
          python /tmp/clipmesh-v044-linux/ci/v053_second_pass_selftest.py

          python ci/finalize-comprehensive-runner.py dev-test-comprehensive.sh /tmp/clipmesh-v1.sh
          python ci/finalize-physical-v2.py /tmp/clipmesh-v1.sh /tmp/clipmesh-v2.sh
          python ci/finalize-physical-v3.py /tmp/clipmesh-v2.sh /tmp/clipmesh-v3.sh
          python ci/finalize-physical-v4.py /tmp/clipmesh-v3.sh /tmp/clipmesh-full.sh
          python ci/focus-physical-failures.py /tmp/clipmesh-full.sh /tmp/clipmesh-focused.sh
          bash -n /tmp/clipmesh-full.sh
          bash -n /tmp/clipmesh-focused.sh

          grep -Fq 'local a="$1" target="$2" reset="m2a-reset-$(nonce)"' /tmp/clipmesh-full.sh
          grep -Fq 'start_driver wait_text "$target"' /tmp/clipmesh-full.sh
          grep -Fq 'clipboard_renderer_rows=' /tmp/clipmesh-full.sh
          grep -Fq 'PHYSICAL_HARDENING_V4_IMAGE_ECHO' /tmp/clipmesh-full.sh
          grep -Fq 'Android -> Mac image sends exactly once with no echo' /tmp/clipmesh-full.sh
          grep -Fq 'Android EXIF image orientation preserved' /tmp/clipmesh-full.sh
          grep -Fq 'Mac -> Android image applies exactly once with no echo' /tmp/clipmesh-full.sh
          grep -Fq 'outgoing_clip_count' /tmp/clipmesh-full.sh
          grep -Fq 'remote_apply_count' /tmp/clipmesh-full.sh
          ! grep -Fq 'a="$1"; expected="$2"; reset="m2a-reset-$(nonce)"' /tmp/clipmesh-full.sh

          grep -Fq 'FOCUSED_SCOPED_REMOTE_WRITE_V5' /tmp/clipmesh-focused.sh
          grep -Fq 'five targeted clipboard regression scenarios only' /tmp/clipmesh-focused.sh
          grep -Fq 'Android text -> image -> text ordering' /tmp/clipmesh-focused.sh
          grep -Fq 'Mac -> Android rapid 10-event burst final state' /tmp/clipmesh-focused.sh
          grep -Fq 'Android -> Mac image sends exactly once with no echo' /tmp/clipmesh-focused.sh
          grep -Fq 'Android EXIF image orientation preserved' /tmp/clipmesh-focused.sh
          grep -Fq 'Mac -> Android image applies exactly once with no echo' /tmp/clipmesh-focused.sh
          grep -Fq 'outgoing_clip_count' /tmp/clipmesh-focused.sh
          grep -Fq 'remote_apply_count' /tmp/clipmesh-focused.sh
          grep -Fq 'patch-acceptance-chain.py' /tmp/clipmesh-focused.sh
          grep -Fq 'CLIPMESH_CODESIGN_IDENTITY="-"' /tmp/clipmesh-focused.sh

          ! grep -Fq '1 MiB Android -> Mac SHA integrity' /tmp/clipmesh-focused.sh
          ! grep -Fq '3-file Mac -> Android batch' /tmp/clipmesh-focused.sh
          ! grep -Fq 'RESTART, REDISCOVERY AND PERSISTENCE' /tmp/clipmesh-focused.sh
          ! grep -Fq 'FINAL STABILITY AND FAILURE SCAN' /tmp/clipmesh-focused.sh
          ! grep -Fq 'Mac non-favorite real prompt Reject' /tmp/clipmesh-focused.sh

          grep -Fq 'status --porcelain --untracked-files=no' dev-test-retry-failures.sh
          grep -Fq 'fetch --quiet origin main' dev-test-retry-failures.sh
          grep -Fq 'rev-parse origin/main' dev-test-retry-failures.sh
          grep -Fq 'finalize-physical-v4.py' dev-test-final.sh
          grep -Fq 'finalize-physical-v4.py' dev-test-retry-failures.sh
