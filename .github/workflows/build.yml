name: Build ClipMesh

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct and patch v0.2.1
        run: |
          set -euo pipefail
          python ci/prepare-icon-assets.py
          python ci/unpack.py
          python ci/patch-features.py
          python ci/patch-sync-fixes.py
          python ci/patch-desktop.py
          python ci/patch-macos.py
          python ci/patch-v014-versions.py
          python ci/patch-v015-sync.py
          python ci/patch-v016-sync.py
          python ci/patch-v017-shizuku.py
          python ci/patch-v018-features.py
          python ci/patch-v019-fixes.py
          python ci/patch-v020-fileshare.py
          python ci/patch-v020-native.py
          python ci/patch-v021-final.py
          python ci/patch-v021-compile-hotfix.py
          python - <<'PY'
          from pathlib import Path
          p = Path('clipmesh/Cargo.toml')
          s = p.read_text()
          p.write_text(s.replace('version = "0.1.0"', 'version = "0.2.1"', 1))
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Validate macOS sources
        run: |
          set -euo pipefail
          grep -q 'source_is_clipmesh' clipmesh/apps/desktop/src/clipboard.rs
          grep -q 'Command::Reset' clipmesh/apps/desktop/src/main.rs
          grep -q 'Clipboard   ·   encrypted sync' ci/ClipMeshApp.swift
          grep -q 'File Transfer   ·   nearby drop' ci/ClipMeshApp.swift
          grep -q 'NSImage(pasteboard:pasteboard)' ci/ClipMeshApp.swift
          grep -q 'split(separator: "\\n")' ci/ClipMeshApp.swift
          grep -q 'func discoverNow()' ci/ClipMeshTransfer.swift
          grep -q 'repeating: 120.0' ci/ClipMeshTransfer.swift
          grep -q 'com.apple.share-services' clipmesh/scripts/build-macos.sh
          grep -q 'clipmesh-share' clipmesh/scripts/build-macos.sh
          grep -q '/api/localsend/v2/prepare-upload' ci/ClipMeshTransfer.swift
          grep -q '/api/localsend/v2/upload' ci/ClipMeshTransfer.swift
      - name: Test protocol core and transport
        working-directory: clipmesh
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python tools/protocol_selftest.py
          cargo test -p clipmesh-core
          cargo test -p clipmesh
      - name: Build macOS app and DMG
        working-directory: clipmesh
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
      - name: Smoke-test and validate macOS package
        working-directory: clipmesh
        run: |
          set -euo pipefail
          SUPPORT="$HOME/Library/Application Support/dev.ClipMesh.ClipMesh"
          rm -rf "$SUPPORT"
          ./dist/macos/ClipMesh.app/Contents/MacOS/ClipMesh --smoke-test
          test -f "$SUPPORT/config.json"
          ./dist/macos/ClipMesh.app/Contents/MacOS/clipmesh-bin status
          test -s dist/macos/ClipMesh.dmg
          test -x dist/macos/ClipMesh.app/Contents/PlugIns/ClipMeshShare.appex/Contents/MacOS/ClipMeshShare
          python - <<'PY'
          import plistlib
          from pathlib import Path
          main = plistlib.loads(Path('dist/macos/ClipMesh.app/Contents/Info.plist').read_bytes())
          ext = plistlib.loads(Path('dist/macos/ClipMesh.app/Contents/PlugIns/ClipMeshShare.appex/Contents/Info.plist').read_bytes())
          assert main.get('CFBundleShortVersionString') == '0.2.1', main.get('CFBundleShortVersionString')
          assert any('clipmesh-share' in item.get('CFBundleURLSchemes', []) for item in main.get('CFBundleURLTypes', []))
          assert ext['NSExtension']['NSExtensionPointIdentifier'] == 'com.apple.share-services'
          print('macOS v0.2.1 and Share extension validated')
          PY
          plutil -lint dist/macos/ClipMesh.app/Contents/Info.plist
          plutil -lint dist/macos/ClipMesh.app/Contents/PlugIns/ClipMeshShare.appex/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/macos/ClipMesh.app
          shasum -a 256 dist/macos/ClipMesh.dmg > dist/macos/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-macOS
          if-no-files-found: error
          path: |
            clipmesh/dist/macos/ClipMesh.dmg
            clipmesh/dist/macos/ClipMesh.app
            clipmesh/dist/macos/ClipMesh-icon.png
            clipmesh/dist/macos/SHA256SUMS.txt

  windows:
    name: Windows EXE
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct and patch v0.2.1
        shell: pwsh
        run: |
          python ci/prepare-icon-assets.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/unpack.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-features.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-sync-fixes.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-desktop.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-windows.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v014-versions.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v015-sync.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v016-sync.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v017-shizuku.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v018-features.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v019-fixes.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v020-fileshare.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v020-native.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v021-final.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v021-compile-hotfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = 'clipmesh/Cargo.toml'
          $s = Get-Content $p -Raw
          $s = $s -replace 'version = "0.1.0"', 'version = "0.2.1"'
          Set-Content $p $s -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Validate Windows sources
        shell: pwsh
        run: |
          $clip = Get-Content 'clipmesh/apps/desktop/src/clipboard.rs' -Raw
          $cfg = Get-Content 'clipmesh/apps/desktop/src/config.rs' -Raw
          $main = Get-Content 'clipmesh/apps/desktop/src/main.rs' -Raw
          $ui = Get-Content 'ci/ClipMeshWindows.cs' -Raw
          $transfer = Get-Content 'ci/ClipMeshTransfer.cs' -Raw
          if (-not $clip.Contains('source_is_clipmesh')) { throw 'Desktop self-capture guard missing' }
          if (-not $main.Contains('Command::Reset')) { throw 'Desktop reset command missing' }
          if (-not $ui.Contains('0.2.1')) { throw 'Windows v0.2.1 metadata missing' }
          if (-not $ui.Contains('Reset all pairing')) { throw 'Windows pairing reset UI missing' }
          if (-not $transfer.Contains('Share with ClipMesh')) { throw 'Explorer integration missing' }
          if (-not $transfer.Contains('224.0.0.167')) { throw 'LAN discovery missing' }
          if (-not $transfer.Contains('/api/localsend/v2/prepare-upload')) { throw 'LocalSend prepare endpoint missing' }
          $defaults = $cfg.Substring($cfg.IndexOf('pub fn default_exclusions()'))
          if ($defaults.Contains('"clipmesh"')) { throw 'ClipMesh remains in desktop default exclusions' }
      - name: Test protocol core and transport
        working-directory: clipmesh
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cryptography; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/protocol_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p clipmesh-core; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p clipmesh; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and smoke-test Windows app
        working-directory: clipmesh
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $roaming = Join-Path $env:APPDATA 'ClipMesh\ClipMesh'
          $local = Join-Path $env:LOCALAPPDATA 'ClipMesh'
          Remove-Item -Recurse -Force $roaming,$local -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath '.\dist\windows\clipmesh.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows smoke test failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'ClipMesh\Runtime\0.2.1\clipmesh-bin.exe'))) { throw 'Windows v0.2.1 runtime missing' }
          $hash = (Get-FileHash dist\windows\clipmesh.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  clipmesh.exe" | Set-Content -Encoding ascii dist\windows\SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-Windows
          if-no-files-found: error
          path: |
            clipmesh/dist/windows/clipmesh.exe
            clipmesh/dist/windows/SHA256SUMS.txt

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct and patch v0.2.1
        run: |
          set -euo pipefail
          python ci/prepare-icon-assets.py
          python ci/unpack.py
          python ci/patch-features.py
          python ci/patch-sync-fixes.py
          python ci/patch-v014-versions.py
          python ci/patch-v015-sync.py
          python ci/patch-v016-sync.py
          python ci/patch-v017-shizuku.py
          python ci/patch-v018-features.py
          python ci/patch-v019-fixes.py
          python ci/patch-v020-fileshare.py
          python ci/patch-v021-final.py
          python ci/patch-v021-compile-hotfix.py
      - name: Validate Android runtime and battery guards
        run: |
          set -euo pipefail
          M=clipmesh/android/app/src/main/AndroidManifest.xml
          J=clipmesh/android/app/src/main/java/dev/clipmesh
          grep -q 'versionName = "0.2.1"' clipmesh/android/app/build.gradle.kts
          grep -q 'versionCode = 11' clipmesh/android/app/build.gradle.kts
          grep -q 'ProcessBuilder("/system/bin/content", "read", "--uri"' "$J/shizuku/ClipboardUserService.kt"
          grep -q 'override fun setPrimaryClipText' "$J/shizuku/ClipboardUserService.kt"
          grep -q 'override fun destroy()' "$J/shizuku/ClipboardUserService.kt"
          grep -q '.version(4)' "$J/shizuku/ShizukuManager.kt"
          grep -q 'BackgroundRuntime.start(this)' "$J/exclusion/ExclusionAccessibilityService.kt"
          grep -q 'buildClipboardPreview' "$J/MainActivity.kt"
          grep -q 'File Transfer' "$J/MainActivity.kt"
          grep -q 'fun discoverNow()' "$J/fileshare/LocalTransferEngine.kt"
          grep -q 'DEVICE_TTL_MS = 180_000L' "$J/fileshare/LocalTransferEngine.kt"
          grep -q 'soTimeout = 0' "$J/network/NetworkEngine.kt"
          grep -q 'ClipMesh/Images' "$J/fileshare/LocalTransferEngine.kt"
          grep -q 'ClipMesh/Videos' "$J/fileshare/LocalTransferEngine.kt"
          grep -q 'Intent.ACTION_SEND_MULTIPLE' "$J/fileshare/FileShareActivity.kt"
          grep -q 'TransferActionReceiver' "$M"
          grep -q 'rikka.shizuku.ShizukuProvider' "$M"
          grep -q 'ExclusionAccessibilityService' "$M"
          ! grep -q 'FileTransferService' "$M"
          ! grep -q 'SyncService' "$M"
          ! grep -q 'FOREGROUND_SERVICE' "$M"
          ! grep -q 'BOOT_COMPLETED' "$M"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: clipmesh/android/**/*.gradle*
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and build APK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          cd clipmesh
          chmod +x android/gradlew scripts/build-android-debug.sh
          ./scripts/build-android-debug.sh
      - name: Validate packaged Android APK
        run: |
          set -euo pipefail
          APK=clipmesh/dist/android/ClipMesh-debug.apk
          test -s "$APK"
          unzip -p "$APK" AndroidManifest.xml > /tmp/manifest.bin
          strings -el /tmp/manifest.bin | grep -q 'dev.clipmesh.exclusion.ExclusionAccessibilityService'
          strings -el /tmp/manifest.bin | grep -q 'dev.clipmesh.fileshare.FileShareActivity'
          strings -el /tmp/manifest.bin | grep -q 'android.intent.action.SEND_MULTIPLE'
          ! strings -el /tmp/manifest.bin | grep -q 'dev.clipmesh.SyncService'
          ! strings -el /tmp/manifest.bin | grep -q 'dev.clipmesh.fileshare.FileTransferService'
          sha256sum "$APK" > clipmesh/dist/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-Android
          if-no-files-found: error
          path: |
            clipmesh/dist/android/ClipMesh-debug.apk
            clipmesh/dist/android/SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [macos, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ClipMesh-macOS
          path: artifacts/macos
      - uses: actions/download-artifact@v8
        with:
          name: ClipMesh-Windows
          path: artifacts/windows
      - uses: actions/download-artifact@v8
        with:
          name: ClipMesh-Android
          path: artifacts/android
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/macos/ClipMesh.dmg release/ClipMesh-macOS.dmg
          cp artifacts/macos/ClipMesh-icon.png release/ClipMesh-icon.png
          cp artifacts/windows/clipmesh.exe release/ClipMesh-Windows.exe
          cp artifacts/android/ClipMesh-debug.apk release/ClipMesh-Android.apk
          cd release
          sha256sum ClipMesh-macOS.dmg ClipMesh-Windows.exe ClipMesh-Android.apk > SHA256SUMS.txt
      - name: Publish v0.2.1 release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            title="ClipMesh ${GITHUB_REF_NAME}"
          else
            tag="v0.2.1-alpha"
            title="ClipMesh v0.2.1-alpha"
          fi
          assets=(release/ClipMesh-macOS.dmg release/ClipMesh-Windows.exe release/ClipMesh-Android.apk release/ClipMesh-icon.png release/SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            exit 0
          fi
          args=(--title "$title" --generate-notes --target "$GITHUB_SHA")
          if [[ "$tag" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" "${assets[@]}" "${args[@]}"
