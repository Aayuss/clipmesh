name: Build ClipMesh

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unpack exact source archive
        run: python ci/unpack.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Test core
        working-directory: clipmesh
        run: cargo test -p clipmesh-core
      - name: Build macOS app and DMG
        working-directory: clipmesh
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
      - name: Checksums
        working-directory: clipmesh
        run: shasum -a 256 dist/macos/ClipMesh.dmg dist/macos/clipmesh > dist/macos/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-macOS
          if-no-files-found: error
          path: |
            clipmesh/dist/macos/ClipMesh.dmg
            clipmesh/dist/macos/ClipMesh.app
            clipmesh/dist/macos/clipmesh
            clipmesh/dist/macos/SHA256SUMS.txt

  windows:
    name: Windows EXE
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unpack exact source archive
        run: python ci/unpack.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Test core
        working-directory: clipmesh
        run: cargo test -p clipmesh-core
      - name: Build Windows executable
        working-directory: clipmesh
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - name: Checksum
        working-directory: clipmesh
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\windows\clipmesh.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  clipmesh.exe" | Set-Content -Encoding ascii dist\windows\SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-Windows
          if-no-files-found: error
          path: |
            clipmesh/dist/windows/clipmesh.exe
            clipmesh/dist/windows/SHA256SUMS.txt

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unpack exact source archive
        run: python ci/unpack.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: clipmesh/android/**/*.gradle*
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: clipmesh
        run: |
          chmod +x android/gradlew scripts/build-android-debug.sh
          ./scripts/build-android-debug.sh
      - name: Checksum
        working-directory: clipmesh
        run: sha256sum dist/android/ClipMesh-debug.apk > dist/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-Android
          if-no-files-found: error
          path: |
            clipmesh/dist/android/ClipMesh-debug.apk
            clipmesh/dist/android/SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS build
        uses: actions/download-artifact@v8
        with:
          name: ClipMesh-macOS
          path: artifacts/macos
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: ClipMesh-Windows
          path: artifacts/windows
      - name: Download Android build
        uses: actions/download-artifact@v8
        with:
          name: ClipMesh-Android
          path: artifacts/android
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/macos/ClipMesh.dmg release/ClipMesh-macOS.dmg
          cp artifacts/windows/clipmesh.exe release/ClipMesh-Windows.exe
          cp artifacts/android/ClipMesh-debug.apk release/ClipMesh-Android.apk
          cd release
          sha256sum ClipMesh-macOS.dmg ClipMesh-Windows.exe ClipMesh-Android.apk > SHA256SUMS.txt
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=(--title "ClipMesh ${GITHUB_REF_NAME}" --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release/ClipMesh-macOS.dmg release/ClipMesh-Windows.exe release/ClipMesh-Android.apk release/SHA256SUMS.txt "${args[@]}"
