name: Build ClipMesh

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct and patch v0.2.3
        run: |
          set -euo pipefail
          python ci/prepare-icon-assets.py
          python ci/unpack.py
          python ci/patch-features.py
          python ci/patch-sync-fixes.py
          python ci/patch-desktop.py
          python ci/patch-macos.py
          python ci/patch-v014-versions.py
          python ci/patch-v015-sync.py
          python ci/patch-v016-sync.py
          python ci/patch-v017-shizuku.py
          python ci/patch-v018-features.py
          python ci/patch-v019-fixes.py
          python ci/patch-v020-fileshare.py
          python ci/patch-v020-native.py
          python ci/patch-v021-final.py
          python ci/patch-v021-compile-hotfix.py
          python ci/patch-v022-final.py
          python ci/patch-v022-hotfix.py
          python ci/patch-v023-final.py
          python - <<'PY'
          from pathlib import Path
          p = Path('clipmesh/Cargo.toml')
          s = p.read_text()
          p.write_text(s.replace('version = "0.1.0"', 'version = "0.2.3"', 1))
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Validate macOS v0.2.3 sources
        run: |
          set -euo pipefail
          grep -q 'buildClipboardPage()' ci/ClipMeshApp.swift
          grep -q 'buildTransferPage()' ci/ClipMeshApp.swift
          grep -q 'buildSettingsPage()' ci/ClipMeshApp.swift
          grep -q 'CMFileDropView' ci/ClipMeshApp.swift
          grep -q 'hasVerticalScroller = true' ci/ClipMeshApp.swift
          grep -q 'registerShareExtension' ci/ClipMeshApp.swift
          grep -q 'dev.clipmesh.private.Share' ci/ClipMeshApp.swift
          grep -q 'convenience init(title: String, handler:' ci/ClipMeshTransfer.swift
          grep -q 'TransferSelfTest' ci/ClipMeshTransfer.swift
          grep -q 'clipmesh://pair?' clipmesh/apps/desktop/src/clipboard.rs
          grep -q 'CFBundleShortVersionString</key><string>0.2.3' clipmesh/scripts/build-macos.sh
          grep -q 'NSExtensionActivationSupportsImageWithMaxCount' clipmesh/scripts/build-macos.sh
          python ci/v022_fileshare_selftest.py
      - name: Test protocol core and transport
        working-directory: clipmesh
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python tools/protocol_selftest.py
          cargo test -p clipmesh-core
          cargo test -p clipmesh
      - name: Build macOS app and DMG
        working-directory: clipmesh
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
      - name: Smoke-test and validate macOS package
        working-directory: clipmesh
        run: |
          set -euo pipefail
          SUPPORT="$HOME/Library/Application Support/dev.ClipMesh.ClipMesh"
          rm -rf "$SUPPORT"
          ./dist/macos/ClipMesh.app/Contents/MacOS/ClipMesh --smoke-test
          test -s dist/macos/ClipMesh.dmg
          test -x dist/macos/ClipMesh.app/Contents/PlugIns/ClipMeshShare.appex/Contents/MacOS/ClipMeshShare
          python - <<'PY'
          import plistlib
          from pathlib import Path
          main = plistlib.loads(Path('dist/macos/ClipMesh.app/Contents/Info.plist').read_bytes())
          ext = plistlib.loads(Path('dist/macos/ClipMesh.app/Contents/PlugIns/ClipMeshShare.appex/Contents/Info.plist').read_bytes())
          assert main['CFBundleShortVersionString'] == '0.2.3'
          assert ext['CFBundleIdentifier'] == 'dev.clipmesh.private.Share'
          assert ext['NSExtension']['NSExtensionPointIdentifier'] == 'com.apple.share-services'
          rule = ext['NSExtension']['NSExtensionAttributes']['NSExtensionActivationRule']
          assert rule['NSExtensionActivationSupportsFileWithMaxCount'] >= 100
          assert rule['NSExtensionActivationSupportsImageWithMaxCount'] >= 100
          print('macOS v0.2.3 Share extension metadata validated')
          PY
          plutil -lint dist/macos/ClipMesh.app/Contents/Info.plist
          plutil -lint dist/macos/ClipMesh.app/Contents/PlugIns/ClipMeshShare.appex/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/macos/ClipMesh.app
          shasum -a 256 dist/macos/ClipMesh.dmg > dist/macos/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-macOS
          if-no-files-found: error
          path: |
            clipmesh/dist/macos/ClipMesh.dmg
            clipmesh/dist/macos/ClipMesh.app
            clipmesh/dist/macos/ClipMesh-icon.png
            clipmesh/dist/macos/SHA256SUMS.txt

  windows:
    name: Windows EXE
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct and patch v0.2.3
        shell: pwsh
        run: |
          python ci/prepare-icon-assets.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/unpack.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-features.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-sync-fixes.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-desktop.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-windows.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v014-versions.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v015-sync.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v016-sync.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v017-shizuku.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v018-features.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v019-fixes.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v020-fileshare.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v020-native.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v021-final.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v021-compile-hotfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v022-final.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v022-hotfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v023-windows.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = 'clipmesh/Cargo.toml'
          $s = Get-Content $p -Raw
          $s = $s -replace 'version = "0.1.0"', 'version = "0.2.3"'
          Set-Content $p $s -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Validate Windows v0.2.3 sources
        shell: pwsh
        run: |
          $ui = Get-Content 'ci/ClipMeshWindows.cs' -Raw
          $transfer = Get-Content 'ci/ClipMeshTransfer.cs' -Raw
          $clip = Get-Content 'clipmesh/apps/desktop/src/clipboard.rs' -Raw
          if (-not $ui.Contains('private const string Version = "0.2.3";')) { throw 'Windows v0.2.3 runtime version missing' }
          if (-not $ui.Contains('"Clipboard", "File transfer", "Settings"')) { throw 'Left navigation missing' }
          if (-not $ui.Contains('AllowDrop = true')) { throw 'Desktop drag/drop missing' }
          if (-not $ui.Contains('RefreshClipboardPreview()')) { throw 'Clipboard preview missing' }
          if (-not $ui.Contains('ChooseTransferFiles()')) { throw 'Integrated file picker missing' }
          if (-not $transfer.Contains('public void DiscoverNow()')) { throw 'Immediate discovery missing' }
          if (-not $transfer.Contains('AddSeconds(-180)')) { throw 'Nearby TTL battery pass missing' }
          if (-not $transfer.Contains('i < 1200 && Running')) { throw 'Discovery battery interval missing' }
          if (-not $clip.Contains('clipmesh://pair?')) { throw 'Pairing-link sync exclusion missing' }
          python ci/v022_fileshare_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test protocol core and transport
        working-directory: clipmesh
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cryptography; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/protocol_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p clipmesh-core; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p clipmesh; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and smoke-test Windows app
        working-directory: clipmesh
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $roaming = Join-Path $env:APPDATA 'ClipMesh\ClipMesh'
          $local = Join-Path $env:LOCALAPPDATA 'ClipMesh'
          Remove-Item -Recurse -Force $roaming,$local -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath '.\dist\windows\clipmesh.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows smoke test failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'ClipMesh\Runtime\0.2.3\clipmesh-bin.exe'))) { throw 'Windows v0.2.3 runtime missing' }
          $hash = (Get-FileHash dist\windows\clipmesh.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  clipmesh.exe" | Set-Content -Encoding ascii dist\windows\SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-Windows
          if-no-files-found: error
          path: |
            clipmesh/dist/windows/clipmesh.exe
            clipmesh/dist/windows/SHA256SUMS.txt

  android:
    name: Android APK + emulator runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct and patch v0.2.3
        run: |
          set -euo pipefail
          python ci/prepare-icon-assets.py
          python ci/unpack.py
          python ci/patch-features.py
          python ci/patch-sync-fixes.py
          python ci/patch-v014-versions.py
          python ci/patch-v015-sync.py
          python ci/patch-v016-sync.py
          python ci/patch-v017-shizuku.py
          python ci/patch-v018-features.py
          python ci/patch-v019-fixes.py
          python ci/patch-v020-fileshare.py
          python ci/patch-v021-final.py
          python ci/patch-v021-compile-hotfix.py
          python ci/patch-v022-final.py
          python ci/patch-v022-hotfix.py
          python ci/patch-v023-final.py
          python ci/patch-v023-android-hotfix.py
      - name: Validate Android v0.2.3 sources
        run: |
          set -euo pipefail
          M=clipmesh/android/app/src/main/AndroidManifest.xml
          J=clipmesh/android/app/src/main/java/dev/clipmesh
          grep -q 'versionCode = 13' clipmesh/android/app/build.gradle.kts
          grep -q 'versionName = "0.2.3"' clipmesh/android/app/build.gradle.kts
          grep -q 'android:usesCleartextTraffic="true"' "$M"
          grep -q 'android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE' "$M"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$M"
          grep -q 'android:name=".BackgroundService"' "$M"
          grep -q 'android:foregroundServiceType="connectedDevice"' "$M"
          grep -q 'android:name=".fileshare.TransferBootReceiver"' "$M"
          grep -q 'android.intent.action.BOOT_COMPLETED' "$M"
          grep -q 'START_STICKY' "$J/BackgroundService.kt"
          grep -q 'FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE' "$J/BackgroundService.kt"
          grep -q 'BackgroundRuntime.start(this)' "$J/BackgroundService.kt"
          grep -q 'capturePending' "$J/clipboard/ClipboardBridge.kt"
          grep -q 'clipmesh://pair?' "$J/clipboard/ClipboardBridge.kt"
          grep -q 'bottomNav(0)' "$J/MainActivity.kt"
          grep -q 'bottomNav()' "$J/fileshare/FileShareActivity.kt"
          grep -q 'bottomNav(2)' "$J/SettingsActivity.kt"
          grep -q 'thumbTintList' "$J/SettingsActivity.kt"
          grep -q 'ACTION_DROP' "$J/fileshare/FileShareActivity.kt"
          grep -q 'autoAcceptFavoriteFiles' "$J/fileshare/LocalTransferEngine.kt"
          grep -q 'NotificationManager.IMPORTANCE_HIGH' "$J/fileshare/TransferNotifications.kt"
          grep -q '"Reject"' "$J/fileshare/TransferNotifications.kt"
          grep -q '"Accept"' "$J/fileshare/TransferNotifications.kt"
          python ci/v022_fileshare_selftest.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: clipmesh/android/**/*.gradle*
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and build APK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          cd clipmesh
          chmod +x android/gradlew scripts/build-android-debug.sh
          ./scripts/build-android-debug.sh
      - name: Validate packaged Android APK
        run: |
          set -euo pipefail
          APK=clipmesh/dist/android/ClipMesh-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > /tmp/manifest.xml
          grep -q 'usesCleartextTraffic="true"' /tmp/manifest.xml
          grep -q 'dev.clipmesh.fileshare.FileShareActivity' /tmp/manifest.xml
          grep -q 'dev.clipmesh.BackgroundService' /tmp/manifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE' /tmp/manifest.xml
          grep -q 'dev.clipmesh.fileshare.TransferBootReceiver' /tmp/manifest.xml
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK" | grep -qx '0.2.3'
          sha256sum "$APK" > clipmesh/dist/android/SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runtime-test Android background receiving on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/android-v023-runtime-test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-Android
          if-no-files-found: error
          path: |
            clipmesh/dist/android/ClipMesh-debug.apk
            clipmesh/dist/android/SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ClipMesh-macOS
          path: artifacts/macos
      - uses: actions/download-artifact@v8
        with:
          name: ClipMesh-Windows
          path: artifacts/windows
      - uses: actions/download-artifact@v8
        with:
          name: ClipMesh-Android
          path: artifacts/android
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/macos/ClipMesh.dmg release/ClipMesh-macOS.dmg
          cp artifacts/macos/ClipMesh-icon.png release/ClipMesh-icon.png
          cp artifacts/windows/clipmesh.exe release/ClipMesh-Windows.exe
          cp artifacts/android/ClipMesh-debug.apk release/ClipMesh-Android.apk
          cd release
          sha256sum ClipMesh-macOS.dmg ClipMesh-Windows.exe ClipMesh-Android.apk > SHA256SUMS.txt
      - name: Publish v0.2.3-alpha
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.2.3-alpha"
          assets=(release/ClipMesh-macOS.dmg release/ClipMesh-Windows.exe release/ClipMesh-Android.apk release/ClipMesh-icon.png release/SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "ClipMesh v0.2.3-alpha" --generate-notes --target "$GITHUB_SHA" --prerelease
          fi