name: Build ClipMesh

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct validated icon assets
        run: python ci/prepare-icon-assets.py
      - name: Unpack exact source archive
        run: python ci/unpack.py
      - name: Apply cross-platform device UI features
        run: python ci/patch-features.py
      - name: Apply sync and Shizuku fixes
        run: python ci/patch-sync-fixes.py
      - name: Enable native desktop credential stores
        run: python ci/patch-desktop.py
      - name: Apply native macOS app wrapper
        run: python ci/patch-macos.py
      - name: Align v0.1.4 native package versions
        run: python ci/patch-v014-versions.py
      - name: Stamp desktop version
        run: python -c "from pathlib import Path; p=Path('clipmesh/Cargo.toml'); s=p.read_text(); p.write_text(s.replace('version = \"0.1.0\"','version = \"0.1.4\"',1))"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Test protocol and core
        working-directory: clipmesh
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python tools/protocol_selftest.py
          cargo test -p clipmesh-core
      - name: Build macOS app and DMG
        working-directory: clipmesh
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
      - name: Smoke-test macOS first launch
        working-directory: clipmesh
        shell: bash
        run: |
          set -euo pipefail
          SUPPORT="$HOME/Library/Application Support/dev.ClipMesh.ClipMesh"
          rm -rf "$SUPPORT"
          ./dist/macos/ClipMesh.app/Contents/MacOS/ClipMesh --smoke-test
          test -f "$SUPPORT/config.json"
          ./dist/macos/ClipMesh.app/Contents/MacOS/clipmesh-bin status
          ./dist/macos/ClipMesh.app/Contents/MacOS/clipmesh-bin ui-state
          plutil -extract CFBundleShortVersionString raw ./dist/macos/ClipMesh.app/Contents/Info.plist | grep -qx '0.1.4'
          file ./dist/macos/ClipMesh.app/Contents/MacOS/ClipMesh
          plutil -lint ./dist/macos/ClipMesh.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 ./dist/macos/ClipMesh.app
      - name: Checksums
        working-directory: clipmesh
        run: shasum -a 256 dist/macos/ClipMesh.dmg dist/macos/clipmesh > dist/macos/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-macOS
          if-no-files-found: error
          path: |
            clipmesh/dist/macos/ClipMesh.dmg
            clipmesh/dist/macos/ClipMesh.app
            clipmesh/dist/macos/clipmesh
            clipmesh/dist/macos/ClipMesh-icon.png
            clipmesh/dist/macos/SHA256SUMS.txt

  windows:
    name: Windows EXE
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct validated icon assets
        run: python ci/prepare-icon-assets.py
      - name: Unpack exact source archive
        run: python ci/unpack.py
      - name: Apply cross-platform device UI features
        run: python ci/patch-features.py
      - name: Apply sync and Shizuku fixes
        run: python ci/patch-sync-fixes.py
      - name: Enable native desktop credential stores
        run: python ci/patch-desktop.py
      - name: Apply native Windows tray wrapper
        run: python ci/patch-windows.py
      - name: Align v0.1.4 native package versions
        run: python ci/patch-v014-versions.py
      - name: Stamp desktop version
        shell: pwsh
        run: |
          $p = 'clipmesh/Cargo.toml'
          $s = Get-Content $p -Raw
          $s = $s -replace 'version = "0.1.0"', 'version = "0.1.4"'
          Set-Content $p $s -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Test protocol and core
        working-directory: clipmesh
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cryptography
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/protocol_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p clipmesh-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows tray application
        working-directory: clipmesh
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - name: Smoke-test Windows first launch
        working-directory: clipmesh
        shell: pwsh
        run: |
          $roaming = Join-Path $env:APPDATA 'ClipMesh\ClipMesh'
          $local = Join-Path $env:LOCALAPPDATA 'ClipMesh'
          Remove-Item -Recurse -Force $roaming -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $local -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath '.\dist\windows\clipmesh.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows smoke test failed with exit code $($process.ExitCode)" }
          $configs = @(
            (Join-Path $env:APPDATA 'ClipMesh\ClipMesh\config\config.json'),
            (Join-Path $env:APPDATA 'ClipMesh\ClipMesh\config.json')
          )
          if (-not ($configs | Where-Object { Test-Path $_ })) { throw 'Windows first-run smoke test did not create config.json.' }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'ClipMesh\Runtime\0.1.4\clipmesh-bin.exe'))) { throw 'Windows launcher did not extract its embedded v0.1.4 sync engine.' }
      - name: Checksum
        working-directory: clipmesh
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\windows\clipmesh.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  clipmesh.exe" | Set-Content -Encoding ascii dist\windows\SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-Windows
          if-no-files-found: error
          path: |
            clipmesh/dist/windows/clipmesh.exe
            clipmesh/dist/windows/SHA256SUMS.txt

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct validated icon assets
        run: python ci/prepare-icon-assets.py
      - name: Unpack exact source archive
        run: python ci/unpack.py
      - name: Apply cross-platform device UI features
        run: python ci/patch-features.py
      - name: Apply sync and Shizuku fixes
        run: python ci/patch-sync-fixes.py
      - name: Align v0.1.4 native package versions
        run: python ci/patch-v014-versions.py
      - name: Validate patched Android sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'moe.shizuku.manager.permission.API_V23' clipmesh/android/app/src/main/AndroidManifest.xml
          grep -q 'android:name=".ExclusionActivity"' clipmesh/android/app/src/main/AndroidManifest.xml
          grep -q 'ExclusionAccessibilityService' clipmesh/android/app/src/main/AndroidManifest.xml
          grep -q 'addBinderReceivedListenerSticky' clipmesh/android/app/src/main/java/dev/clipmesh/shizuku/ShizukuManager.kt
          grep -q 'unbindUserService(args, connection, false)' clipmesh/android/app/src/main/java/dev/clipmesh/shizuku/ShizukuManager.kt
          ! grep -q 'exitProcess(0)' clipmesh/android/app/src/main/java/dev/clipmesh/shizuku/ClipboardUserService.kt
          grep -q 'captureNowForBackgroundMonitor' clipmesh/android/app/src/main/java/dev/clipmesh/SyncService.kt
          grep -q 'preferredOutgoing' clipmesh/android/app/src/main/java/dev/clipmesh/network/NetworkEngine.kt
          grep -q 'versionName = "0.1.4"' clipmesh/android/app/build.gradle.kts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: clipmesh/android/**/*.gradle*
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: clipmesh
        run: |
          chmod +x android/gradlew scripts/build-android-debug.sh
          ./scripts/build-android-debug.sh
      - name: Validate packaged APK components
        shell: bash
        run: |
          set -euo pipefail
          APK=clipmesh/dist/android/ClipMesh-debug.apk
          test -s "$APK"
          unzip -p "$APK" AndroidManifest.xml > /tmp/manifest.bin
          strings -el /tmp/manifest.bin | grep -q 'dev.clipmesh.ExclusionActivity'
          strings -el /tmp/manifest.bin | grep -q 'dev.clipmesh.exclusion.ExclusionAccessibilityService'
          strings -el /tmp/manifest.bin | grep -q 'moe.shizuku.manager.permission.API_V23'
      - name: Checksum
        working-directory: clipmesh
        run: sha256sum dist/android/ClipMesh-debug.apk > dist/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-Android
          if-no-files-found: error
          path: |
            clipmesh/dist/android/ClipMesh-debug.apk
            clipmesh/dist/android/SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [macos, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS build
        uses: actions/download-artifact@v8
        with:
          name: ClipMesh-macOS
          path: artifacts/macos
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: ClipMesh-Windows
          path: artifacts/windows
      - name: Download Android build
        uses: actions/download-artifact@v8
        with:
          name: ClipMesh-Android
          path: artifacts/android
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/macos/ClipMesh.dmg release/ClipMesh-macOS.dmg
          cp artifacts/macos/ClipMesh-icon.png release/ClipMesh-icon.png
          cp artifacts/windows/clipmesh.exe release/ClipMesh-Windows.exe
          cp artifacts/android/ClipMesh-debug.apk release/ClipMesh-Android.apk
          cd release
          sha256sum ClipMesh-macOS.dmg ClipMesh-Windows.exe ClipMesh-Android.apk > SHA256SUMS.txt
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            title="ClipMesh ${GITHUB_REF_NAME}"
          else
            tag="v0.1.4-alpha"
            title="ClipMesh v0.1.4-alpha"
          fi
          assets=(
            release/ClipMesh-macOS.dmg
            release/ClipMesh-Windows.exe
            release/ClipMesh-Android.apk
            release/ClipMesh-icon.png
            release/SHA256SUMS.txt
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            exit 0
          fi
          args=(--title "$title" --generate-notes --target "$GITHUB_SHA")
          if [[ "$tag" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" "${assets[@]}" "${args[@]}"
