name: Release ClipMesh v0.2.20

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.20.yml'
      - 'ci/patch-v049-event-driven-performance.py'
      - 'ci/patch-v050-ultra-idle.py'
      - 'ci/patch-v052-android-clipboard-runtime.py'
      - 'ci/patch-v053-second-pass-runtime.py'
      - 'ci/patch-v054-resource-finalization.py'
      - 'ci/V054_RESOURCE_AUDIT.md'
      - 'ci/patch-v051-release.py'
      - 'ci/patch-v055-pairing-core.py'
      - 'ci/patch-v055-macos-pairing.py'
      - 'ci/patch-v055-macos-storage.py'
      - 'ci/patch-v055-android-pairing.py'
      - 'ci/patch-v055-android-storage.py'
      - 'ci/patch-v055-android-storage-ui.py'
      - 'ci/patch-v055-windows-pairing.py'
      - 'ci/patch-v055-windows-storage.py'
      - 'ci/v055_pairing_storage_selftest.py'
      - 'ci/patch-v057-pairing-ux.py'
      - 'ci/v057_pairing_ux_selftest.py'
      - 'ci/patch-v056-release.py'
      - 'ci/reconstruct.py'
      - 'ci/v027_macos_daemon_selftest.py'
      - 'ci/v031_devtest_selftest.py'
      - 'ci/v033_ipv4_transfer_selftest.py'
      - 'ci/v047_file_transfer_progress_selftest.py'
      - 'ci/v052_android_clipboard_runtime_selftest.py'
      - 'ci/v053_second_pass_selftest.py'
      - 'ci/v054_resource_finalization_selftest.py'
      - 'README.md'

permissions:
  contents: read

env:
  PREVIOUS_RELEASE_SHA: a373fba1f5a8753123f0fa96a5400f3838ae4eb6
  RELEASE_VERSION: 0.2.20
  RELEASE_TAG: v0.2.20-alpha

jobs:
  verify-boundary:
    name: Verify v0.2.20 release boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify previous release ancestry and release scripts
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PREVIOUS_RELEASE_SHA" HEAD
          echo "Changes since the v0.2.17 pairing/output-folder baseline:"
          git diff --name-only "$PREVIOUS_RELEASE_SHA"..HEAD
          python -m py_compile \
            ci/patch-v036-release.py \
            ci/patch-v046-release.py \
            ci/patch-v048-release.py \
            ci/patch-v049-event-driven-performance.py \
            ci/patch-v050-ultra-idle.py \
            ci/patch-v052-android-clipboard-runtime.py \
            ci/patch-v053-second-pass-runtime.py \
            ci/patch-v054-resource-finalization.py \
            ci/patch-v055-pairing-core.py \
            ci/patch-v055-macos-pairing.py \
            ci/patch-v055-macos-storage.py \
            ci/patch-v055-android-pairing.py \
            ci/patch-v055-android-storage.py \
            ci/patch-v055-android-storage-ui.py \
            ci/patch-v055-windows-pairing.py \
            ci/patch-v055-windows-storage.py \
            ci/patch-v056-release.py \
            ci/patch-v051-release.py \
            ci/v027_macos_daemon_selftest.py \
            ci/v031_devtest_selftest.py \
            ci/v033_ipv4_transfer_selftest.py \
            ci/v047_file_transfer_progress_selftest.py \
            ci/v052_android_clipboard_runtime_selftest.py \
            ci/v053_second_pass_selftest.py \
            ci/v054_resource_finalization_selftest.py \
            ci/v055_pairing_storage_selftest.py \
            ci/patch-v057-pairing-ux.py \
            ci/v057_pairing_ux_selftest.py
          python ci/v032_release_signing_selftest.py

  macos:
    name: macOS v0.2.20 DMG
    needs: verify-boundary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Reconstruct and validate optimized macOS source
        run: |
          set -euo pipefail
          python ci/reconstruct.py --platform Darwin
          CLIPMESH_PLATFORM=Darwin python ci/v027_macos_daemon_selftest.py
          CLIPMESH_PLATFORM=Darwin python ci/v031_devtest_selftest.py
          python ci/v033_ipv4_transfer_selftest.py
          CLIPMESH_PLATFORM=Darwin python ci/v047_file_transfer_progress_selftest.py
          CLIPMESH_PLATFORM=Darwin python ci/v053_second_pass_selftest.py
          CLIPMESH_PLATFORM=Darwin python ci/v054_resource_finalization_selftest.py
          CLIPMESH_PLATFORM=Darwin python ci/v055_pairing_storage_selftest.py
          CLIPMESH_PLATFORM=Darwin python ci/v057_pairing_ux_selftest.py
          grep -q 'clipmesh-macos-pasteboard-fallback' /dev/null || true
          ! grep -q 'clipmesh-macos-pasteboard-fallback' clipmesh/apps/desktop/src/clipboard.rs
          ! grep -q 'Duration::from_millis(350)' clipmesh/apps/desktop/src/clipboard.rs
          ! grep -q 'DispatchSource.makeTimerSource' ci/ClipMeshTransfer.swift
          python ci/patch-v036-release.py
          python ci/patch-v046-release.py
          python ci/patch-v048-release.py
          python ci/patch-v051-release.py
          python ci/patch-v056-release.py
          python ci/v032_release_signing_selftest.py
          grep -q 'CFBundleShortVersionString</key><string>0.2.20' clipmesh/scripts/build-macos.sh
          grep -q 'CFBundleVersion</key><string>0.2.20' clipmesh/scripts/build-macos.sh
          grep -q '^version = "0.2.20"$' clipmesh/Cargo.toml
      - name: Test protocol core and transport
        working-directory: clipmesh
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography
          python tools/protocol_selftest.py
          cargo test -p clipmesh-core
          cargo test -p clipmesh
      - name: Build macOS app and DMG
        working-directory: clipmesh
        run: |
          set -euo pipefail
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
      - name: Configure macOS release signing
        env:
          CLIPMESH_MACOS_CERTIFICATE_P12_B64: ${{ secrets.CLIPMESH_MACOS_CERTIFICATE_P12_B64 }}
          CLIPMESH_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.CLIPMESH_MACOS_CERTIFICATE_PASSWORD }}
          CLIPMESH_MACOS_SIGNING_IDENTITY: ${{ secrets.CLIPMESH_MACOS_SIGNING_IDENTITY }}
        run: bash ci/macos-release-signing.sh setup
      - name: Apply and verify macOS release signing
        env:
          CLIPMESH_MACOS_SIGNING_IDENTITY: ${{ secrets.CLIPMESH_MACOS_SIGNING_IDENTITY }}
        run: bash ci/macos-release-signing.sh sign
      - name: Notarize macOS DMG when configured
        env:
          CLIPMESH_MACOS_NOTARY_APPLE_ID: ${{ secrets.CLIPMESH_MACOS_NOTARY_APPLE_ID }}
          CLIPMESH_MACOS_NOTARY_TEAM_ID: ${{ secrets.CLIPMESH_MACOS_NOTARY_TEAM_ID }}
          CLIPMESH_MACOS_NOTARY_PASSWORD: ${{ secrets.CLIPMESH_MACOS_NOTARY_PASSWORD }}
        run: bash ci/macos-release-signing.sh notarize
      - name: Smoke-test and validate macOS release
        working-directory: clipmesh
        run: |
          set -euo pipefail
          ./dist/macos/ClipMesh.app/Contents/MacOS/ClipMesh --smoke-test
          test -s dist/macos/ClipMesh.dmg
          test -x dist/macos/ClipMesh.app/Contents/PlugIns/ClipMeshShare.appex/Contents/MacOS/ClipMeshShare
          python - <<'PY'
          import plistlib
          from pathlib import Path
          info = plistlib.loads(Path('dist/macos/ClipMesh.app/Contents/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString'] == '0.2.20'
          assert info['CFBundleVersion'] == '0.2.20'
          print('macOS v0.2.20 metadata validated')
          PY
          codesign --verify --deep --strict --verbose=2 dist/macos/ClipMesh.app
          shasum -a 256 dist/macos/ClipMesh.dmg > dist/macos/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-v0.2.20-macOS
          if-no-files-found: error
          path: |
            clipmesh/dist/macos/ClipMesh.dmg
            clipmesh/dist/macos/ClipMesh-icon.png
            clipmesh/dist/macos/SHA256SUMS.txt
      - name: Remove temporary macOS signing material
        if: always()
        run: bash ci/macos-release-signing.sh cleanup

  windows:
    name: Windows v0.2.20 EXE
    needs: verify-boundary
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipmesh
      - name: Reconstruct and validate optimized Windows source
        shell: pwsh
        run: |
          python ci/reconstruct.py --platform Windows; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CLIPMESH_PLATFORM = 'Windows'
          python ci/v027_macos_daemon_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/v031_devtest_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/v033_ipv4_transfer_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/v047_file_transfer_progress_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/v053_second_pass_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/v054_resource_finalization_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CLIPMESH_PLATFORM='Windows'; python ci/v055_pairing_storage_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CLIPMESH_PLATFORM='Windows'; python ci/v057_pairing_ux_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $transfer = Get-Content 'ci/ClipMeshTransfer.cs' -Raw
          if ($transfer.Contains('AnnounceLoop')) { throw 'Recurring Windows transfer announcer survived' }
          python ci/patch-v036-release.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v046-release.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v048-release.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v051-release.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/patch-v056-release.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/v032_release_signing_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ui = Get-Content 'ci/ClipMeshWindows.cs' -Raw
          if (-not $ui.Contains('private const string Version = "0.2.20";')) { throw 'Windows v0.2.20 runtime version missing' }
          if (-not (Get-Content 'clipmesh/Cargo.toml' -Raw).Contains('version = "0.2.20"')) { throw 'Cargo v0.2.20 package version missing' }
      - name: Test protocol core and transport
        working-directory: clipmesh
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cryptography; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/protocol_selftest.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p clipmesh-core; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p clipmesh; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and smoke-test Windows release
        working-directory: clipmesh
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $roaming = Join-Path $env:APPDATA 'ClipMesh\ClipMesh'
          $local = Join-Path $env:LOCALAPPDATA 'ClipMesh'
          Remove-Item -Recurse -Force $roaming,$local -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath '.\dist\windows\clipmesh.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows smoke test failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'ClipMesh\Runtime\0.2.20\clipmesh-bin.exe'))) { throw 'Windows v0.2.20 runtime missing' }
          $hash = (Get-FileHash dist\windows\clipmesh.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  clipmesh.exe" | Set-Content -Encoding ascii dist\windows\SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-v0.2.20-Windows
          if-no-files-found: error
          path: |
            clipmesh/dist/windows/clipmesh.exe
            clipmesh/dist/windows/SHA256SUMS.txt

  android:
    name: Android v0.2.20 APK
    needs: verify-boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Reconstruct and validate optimized Android source
        run: |
          set -euo pipefail
          python ci/reconstruct.py --platform Linux
          CLIPMESH_PLATFORM=Linux python ci/v027_macos_daemon_selftest.py
          CLIPMESH_PLATFORM=Linux python ci/v031_devtest_selftest.py
          python ci/v033_ipv4_transfer_selftest.py
          CLIPMESH_PLATFORM=Linux python ci/v047_file_transfer_progress_selftest.py
          python ci/v034_shizuku_clipboard_selftest.py
          python ci/v052_android_clipboard_runtime_selftest.py
          python ci/v053_second_pass_selftest.py
          python ci/v054_resource_finalization_selftest.py
          CLIPMESH_PLATFORM=Linux python ci/v055_pairing_storage_selftest.py
          CLIPMESH_PLATFORM=Linux python ci/v057_pairing_ux_selftest.py
          J=clipmesh/android/app/src/main/java/dev/clipmesh
          ! grep -q 'ClipMesh-ClipboardWatch' "$J/BackgroundRuntime.kt"
          ! grep -q 'scheduleWithFixedDelay' "$J/BackgroundRuntime.kt"
          ! grep -q '650L' "$J/BackgroundRuntime.kt"
          ! grep -q 'runAnnouncer' "$J/fileshare/LocalTransferEngine.kt"
          grep -q 'listener = { bridge.captureNowForSystemEvent() }' "$J/BackgroundRuntime.kt"
          grep -q '.version(12)' "$J/shizuku/ShizukuManager.kt"
          python ci/patch-v036-release.py
          python ci/patch-v046-release.py
          python ci/patch-v048-release.py
          python ci/patch-v051-release.py
          python ci/patch-v056-release.py
          python ci/v032_release_signing_selftest.py
          grep -q 'versionCode = 30' clipmesh/android/app/build.gradle.kts
          grep -q 'versionName = "0.2.20"' clipmesh/android/app/build.gradle.kts
          grep -q '^version = "0.2.20"$' clipmesh/Cargo.toml
      - name: Install Android SDK and build debug APK
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          cd clipmesh
          chmod +x android/gradlew scripts/build-android-debug.sh
          (cd android && ./gradlew :app:testDebugUnitTest)
          ./scripts/build-android-debug.sh
          APK=dist/android/ClipMesh-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK" | grep -qx '0.2.20'
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK" | grep -qx '30'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runtime-test Android background send and receive on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/android-v023-runtime-test.sh
      - name: Build and verify permanently signed Android release APK
        env:
          CLIPMESH_ANDROID_KEYSTORE_B64: ${{ secrets.CLIPMESH_ANDROID_KEYSTORE_B64 }}
          CLIPMESH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CLIPMESH_ANDROID_KEYSTORE_PASSWORD }}
          CLIPMESH_ANDROID_KEY_ALIAS: ${{ secrets.CLIPMESH_ANDROID_KEY_ALIAS }}
          CLIPMESH_ANDROID_KEY_PASSWORD: ${{ secrets.CLIPMESH_ANDROID_KEY_PASSWORD }}
          CLIPMESH_ANDROID_SIGNING_CERT_SHA256: ${{ vars.CLIPMESH_ANDROID_SIGNING_CERT_SHA256 }}
          CLIPMESH_ANDROID_EXPECTED_PACKAGE: dev.clipmesh
          CLIPMESH_ANDROID_EXPECTED_VERSION_NAME: 0.2.20
          CLIPMESH_ANDROID_EXPECTED_VERSION_CODE: '30'
        run: bash ci/build-android-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ClipMesh-v0.2.20-Android
          if-no-files-found: error
          path: |
            clipmesh/dist/android/ClipMesh-release.apk
            clipmesh/dist/android/SHA256SUMS.txt

  release:
    name: Publish v0.2.20-alpha
    needs: [verify-boundary, macos, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ClipMesh-v0.2.20-macOS
          path: artifacts/macos
      - uses: actions/download-artifact@v8
        with:
          name: ClipMesh-v0.2.20-Windows
          path: artifacts/windows
      - uses: actions/download-artifact@v8
        with:
          name: ClipMesh-v0.2.20-Android
          path: artifacts/android
      - name: Prepare and verify release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/macos/ClipMesh.dmg release/ClipMesh-macOS.dmg
          cp artifacts/macos/ClipMesh-icon.png release/ClipMesh-icon.png
          cp artifacts/windows/clipmesh.exe release/ClipMesh-Windows.exe
          cp artifacts/android/ClipMesh-release.apk release/ClipMesh-Android.apk
          cd release
          test -s ClipMesh-macOS.dmg
          test -s ClipMesh-Windows.exe
          test -s ClipMesh-Android.apk
          sha256sum ClipMesh-macOS.dmg ClipMesh-Windows.exe ClipMesh-Android.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish immutable release and refresh dev-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          dev_tag="dev-latest"
          assets=(release/ClipMesh-macOS.dmg release/ClipMesh-Windows.exe release/ClipMesh-Android.apk release/ClipMesh-icon.png release/SHA256SUMS.txt)
          notes='ClipMesh v0.2.20 adds reliable bidirectional re-pairing after device removal, automatic paired-device refresh, larger six-digit verification UI, persistent custom receive folders on macOS/Windows/Android, images/video subfolders, metadata-only macOS receive-folder recency updates, and reduced pairing polling. It retains the event-driven clipboard and low-idle runtime improvements from v0.2.17.'

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; keeping its published assets immutable."
          else
            gh release create "$tag" "${assets[@]}" \
              --title "ClipMesh v0.2.20-alpha" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

          if gh release view "$dev_tag" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs/tags/$dev_tag" -X PATCH -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload "$dev_tag" "${assets[@]}" --clobber
            gh release edit "$dev_tag" --title "ClipMesh dev-latest" --prerelease --latest=false --notes "Latest green cross-platform development build from main."
          else
            gh release create "$dev_tag" "${assets[@]}" \
              --title "ClipMesh dev-latest" \
              --notes "Latest green cross-platform development build from main." \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false
          fi
